name: Process Approval Comment

# DISABLED (2026-09-14, owner request): outreach sending must happen only
# through client-outreach-agent, never directly from business-operator.
# Trigger is now manual-only (workflow_dispatch), so an "APPROVE ..." GitHub
# comment can no longer fire this automatically, and the job itself is
# hard-skipped as a second safeguard. To re-enable, restore the
# `issue_comment` trigger below and remove the job-level `if: false`.
on:
  workflow_dispatch:

jobs:
  process:
    if: false && contains(github.event.issue.labels.*.name, 'outreach-approval') && github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests google-auth google-api-python-client

      - name: Process approval and send approved emails only
        env:
          APPROVAL_COMMENT: ${{ github.event.comment.body }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: python scripts/process_approval.py

      - name: Commit updated outreach status
        run: |
          git config user.name "business-operator-bot"
          git config user.email "bot@users.noreply.github.com"
          git add memory/outreach.json logs/
          git diff --quiet && git diff --staged --quiet || git commit -m "Processed approval comment"
          git push
